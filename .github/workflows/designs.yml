on:
  workflow_dispatch:
    inputs:
      sc-ref:
        required: false
        type: string
        description: which siliconcompiler ref to use
      lambdapdk-ref:
        required: false
        type: string
        description: which lambdapdk ref to use
      concurrency:
        required: false
        type: number
        default: 50
        description: how many concurrent runners to use
      timeout:
        required: false
        type: number
        default: 120
        description: timeout for design matrix in minutes
      run:
        required: false
        type: choice
        default: default
        description: types of designs to run
        options:
          - all
          - default
          - tiny

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.sc-ref }}-${{ inputs.lambdapdk-ref }}
  cancel-in-progress: true

name: 'Run Gallery Designs'

# Least-privilege default; both jobs below call out to workflows that need
# more, so each states its own cap.
permissions:
  contents: read

jobs:
  designs:
    # Cap for the whole nested chain. run-designs.yml defaults its own jobs to
    # contents: read; packages: read is here because its design jobs run in the
    # ghcr.io tool container.
    permissions:
      contents: read
      packages: read

    uses: ./.github/workflows/run-designs.yml
    with:
      sc-ref: ${{ inputs.sc-ref }}
      lambdapdk-ref: ${{ inputs.lambdapdk-ref }}
      concurrency: ${{ fromJson(inputs.concurrency) }}
      scgallery-ref: ${{ github.ref }}
      fail-fast: false
      run: ${{ inputs.run }}
      timeout: ${{ fromJson(inputs.timeout) }}
    secrets: inherit

  update_montage:
    name: Merge image artifacts
    if: always() && !failure() && !cancelled()
    needs: designs

    # Cap for montage.yml: it pushes bot/montage, opens the PR, and reads this
    # run's artifacts through the API.
    permissions:
      contents: write
      pull-requests: write
      actions: read

    uses: ./.github/workflows/montage.yml
    secrets: inherit
